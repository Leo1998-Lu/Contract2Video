[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract2video"
version = "0.1.0"
description = "Evidence-grounded planning and local repair for language-driven video workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
quality = ["ruff>=0.6"]

[project.scripts]
contract2video = "contract2video.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract2video = ["py.typed"]
